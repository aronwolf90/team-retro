name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      TEAM_PASSWORD: ${{ secrets.TEAM_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host keys
        run: |
          mkdir -p ~/.ssh
          sed 's/^ *//' >> ~/.ssh/known_hosts <<'KEYS'
            62.238.15.241 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOy1XPZmZVYnBdlWisyZolb0nd1FOpiOfpckOI/7HouBo57Yrddcrn1JKd2IdCwuFiDP363PZKZ/n5rG8IyAXM4=
            62.238.15.241 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEH5Drsiz7uglhKQHlNnctrRYTDKBheF996rmMjMWWhK
            62.238.15.241 ssh-rsa 
          KEYS

      - name: Write Rails master key
        run: echo "${{ secrets.RAILS_MASTER_KEY }}" > config/master.key

      - name: Deploy with Kamal
        run: bin/kamal deploy
